[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-supervision"
version = "1.1.0"
description = "External AI Supervision & Human-in-the-Loop Pre-Execution Gate for Antigravity"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Aegis Security Team"}
]
keywords = ["security", "supervision", "ai-safety", "antigravity", "human-in-the-loop"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
